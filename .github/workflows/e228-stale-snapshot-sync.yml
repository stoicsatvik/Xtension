name: E228 stale pairing snapshot sync
on:
  push:
    branches:
      - research/e228-stale-snapshot-sync-20261025
  pull_request:
permissions:
  contents: read
jobs:
  stale-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-package-lock
      - name: E228 delayed snapshot regressions
        run: npx vitest run tests/mcp-bridge-stale-snapshot-sync.test.js
      - name: Inherited E223-E227 regressions
        run: npx vitest run tests/mcp-bridge-token-rotation-race.test.js tests/mcp-bridge-local-revocation-serialization.test.js tests/mcp-bridge-revocation-commit-races.test.js
      - name: Agent syntax
        run: node --check agent/background-mcp-bridge.js
