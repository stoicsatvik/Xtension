name: E225 revoked action boundary
on:
  push:
    branches:
      - research/e225-revoked-action-boundary-20261025
  pull_request:
permissions:
  contents: read
jobs:
  action-boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-package-lock
      - name: Revoked pairing during asynchronous action
        run: npx vitest run tests/mcp-bridge-revoked-action-boundary.test.js
      - name: Agent syntax
        run: node --check agent/background-mcp-bridge.js
