name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - name: Validate Chrome agent manifest
        run: node -e "JSON.parse(require('fs').readFileSync('agent/manifest.json','utf8'))"
      - name: Check Chrome agent module syntax
        run: |
          for file in agent/service-worker.js agent/dashboard-v2.js agent/impact-widget.js agent/recovery-archive.js agent/core.js agent/trial-policy.js agent/permission-catalog.js agent/decision-intelligence.js agent/cleanup-impact.js; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done
      - run: npm run build
