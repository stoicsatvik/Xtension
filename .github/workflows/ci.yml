name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm test
      - name: Validate Chrome agent manifest and entrypoint
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('agent/manifest.json', 'utf8'));
          const worker = manifest?.background?.service_worker;
          if (!worker) throw new Error('Manifest has no background service worker');
          if (!fs.existsSync(`agent/${worker}`)) throw new Error(`Missing service worker: agent/${worker}`);
          for (const html of ['agent/dashboard.html', 'agent/audit.html', 'agent/onboarding.html']) {
            const source = fs.readFileSync(html, 'utf8');
            if (/<script(?![^>]*\bsrc=)[^>]*>/i.test(source)) {
              throw new Error(`${html} contains an inline script, which violates MV3 extension CSP`);
            }
          }
          NODE
      - name: Check Chrome agent module syntax
        run: |
          for file in agent/service-worker-entry.js agent/background-onboarding.js agent/background-recovery.js agent/background-install-review.js agent/install-review-policy.js agent/background-version-history.js agent/version-history-policy.js agent/service-worker.js agent/onboarding.js agent/dashboard-v2.js agent/dashboard-nav.js agent/audit.js agent/audit-session.js agent/trial-cadence.js agent/impact-widget.js agent/realized-impact.js agent/realized-impact-widget.js agent/version-history-widget.js agent/recovery-archive.js agent/alert-review.js agent/export-policy.js agent/evidence-export.js agent/core.js agent/trial-policy.js agent/permission-catalog.js agent/decision-intelligence.js agent/cleanup-impact.js; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done
      - run: npm run build
