name: E217 cross-process CAS lock regression
on:
  push:
    branches:
      - research/e217-cross-process-cas-lock-20261024
  pull_request:
permissions:
  contents: read
jobs:
  stale-writer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: E217 isolated real-filesystem two-process regressions
        run: node --test mcp/node-tests/experiments/stale-process-overwrite.mjs
      - name: Existing E213-E215 regressions
        run: node --test mcp/node-tests/snapshot-persistence-order.mjs mcp/node-tests/snapshot-revision-aliasing.mjs mcp/node-tests/persisted-state-corruption.mjs
      - name: Syntax checks
        run: |
          node --check mcp/src/state-store.mjs
          node --check mcp/node-tests/experiments/stale-process-overwrite.mjs
