name: E216 cross-process stale-writer falsification
on:
  push:
    branches:
      - research/e216-stale-process-overwrite-20261024
  pull_request:
permissions:
  contents: read
jobs:
  stale-writer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: E216 isolated two-process falsification (expected red)
        id: falsification
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          node --test mcp/node-tests/experiments/stale-process-overwrite.mjs 2>&1 | tee e216-falsification.log
      - name: Verify the specific stale-writer counterexample was reproduced
        if: always()
        shell: bash
        run: |
          test "${{ steps.falsification.outcome }}" = "failure"
          grep -F "E216 stale writer regressed canonical timestamp" e216-falsification.log
          grep -F "not ok" e216-falsification.log
      - name: Existing E213-E215 regressions
        run: |
          node --test mcp/node-tests/snapshot-persistence-order.mjs mcp/node-tests/snapshot-revision-aliasing.mjs mcp/node-tests/persisted-state-corruption.mjs
      - name: Syntax checks
        run: |
          node --check mcp/src/state-store.mjs
          node --check mcp/node-tests/experiments/stale-process-overwrite.mjs
