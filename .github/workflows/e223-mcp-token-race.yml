name: E223 MCP pairing token race
on:
  push:
    branches:
      - research/e223-token-rotation-race-20261024
  pull_request:
permissions:
  contents: read
jobs:
  token-race:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-package-lock
      - name: E223 revoked-token completion race
        run: npx vitest run tests/mcp-bridge-token-rotation-race.test.js
      - name: Agent syntax
        run: node --check agent/background-mcp-bridge.js
